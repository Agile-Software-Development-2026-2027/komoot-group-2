# CI: runs on every pull request and on every push to main.
# The job "test" is a required check on main: a pull request cannot be merged until it is green.
# Do not rename the job.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # lets you run CI by hand from the Actions tab

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Frontend (Angular + Vitest) 
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # same as dockerfile
          cache: npm
          cache-dependency-path: MyWay_frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: MyWay_frontend
        run: npm ci

      - name: Frontend tests (*.spec.ts)
        working-directory: MyWay_frontend
        run: npx ng test --watch=false

      - name: Frontend build
        working-directory: MyWay_frontend
        run: npm run build

      # Backend (Spring Boot + JUnit) 
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25 
          cache: maven

      - name: Backend tests
        working-directory: MyWay_backend
        run: ./mvnw -B test
