spring:
  application:
    name: MyWay

  # PostgreSQL started by compose.yaml in the repository root (docker compose up -d db).
  # Same variables/defaults as compose.yaml, so a shared .env configures both.
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:myway}
    username: ${POSTGRES_USER:myway}
    password: ${POSTGRES_PASSWORD:myway}

  jpa:
    hibernate:
      # The schema is owned by Flyway (src/main/resources/db/migration).
      # Hibernate only checks at startup that the entities match the tables.
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
