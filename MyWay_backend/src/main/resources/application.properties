spring.application.name=MyWay

# PostgreSQL started by compose.yaml in the repository root (docker compose up -d db).
# Override with the SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD environment variables.
spring.datasource.url=jdbc:postgresql://localhost:5432/myway
spring.datasource.username=myway
spring.datasource.password=myway

# The schema is owned by Flyway (src/main/resources/db/migration), not by Hibernate
spring.jpa.hibernate.ddl-auto=none
