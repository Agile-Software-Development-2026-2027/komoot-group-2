# Tests use an in-memory H2 database (PostgreSQL mode) instead of PostgreSQL, so they run without Docker.
# Flyway still creates the schema from src/main/resources/db/migration.
spring.datasource.url=jdbc:h2:mem:myway;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
