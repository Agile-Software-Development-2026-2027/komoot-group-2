<app-menu-bar />

@if (gpxService.notification$ | async; as notif) {
  <div
    class="notification-toast"
    [class.toast-success]="notif.type === 'success'"
    [class.toast-error]="notif.type === 'error'"
    role="alert"
    aria-live="polite">
    <div class="toast-icon">
      @if (notif.type === 'success') {
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      } @else {
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
      }
    </div>
    <span class="toast-message">{{ notif.message }}</span>
    <button type="button" class="toast-close" (click)="dismissNotification()" aria-label="Chiudi notifica">
      &times;
    </button>
  </div>
}

<main class="content">
  <app-italy-map />
</main>

@if (isDragging()) {
  <div class="drag-drop-overlay">
    <div class="drop-zone-card">
      <svg viewBox="0 0 24 24" width="56" height="56" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/>
        <line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
      <h3>Drop the file</h3>
      <p></p>
    </div>
  </div>
}
