<nav class="menu-bar">
  <div class="brand">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" />
      <circle cx="12" cy="10" r="3" />
    </svg>
    <span>MyWay</span>
  </div>

  <div class="menu-items">
    <div class="menu-dropdown-container">
      <button
        type="button"
        class="menu-btn"
        [class.active]="isFileMenuOpen"
        (click)="toggleFileMenu($event)"
        aria-haspopup="true"
        [attr.aria-expanded]="isFileMenuOpen">
        File
      </button>

      @if (isFileMenuOpen) {
        <div class="dropdown-menu" role="menu">
          <button
            type="button"
            class="dropdown-item"
            (click)="onAddClick()"
            role="menuitem">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 5v14M5 12h14"/>
            </svg>
            <span>Add</span>
          </button>

          <button
            type="button"
            class="dropdown-item"
            [disabled]="!hasRoute()"
            (click)="onExportClick()"
            role="menuitem">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <polyline points="7 10 12 15 17 10" />
              <line x1="12" y1="15" x2="12" y2="3" />
            </svg>
            <span>Export GPX</span>
          </button>
        </div>
      }
    </div>

    <button type="button" class="menu-btn">Help</button>
  </div>

  <div class="user-container">
    <button
      type="button"
      class="user-btn"
      [class.active]="isLoginOpen || isSignInOpen"
      (click)="toggleLoginPopup($event)"
      aria-haspopup="dialog"
      [attr.aria-expanded]="isLoginOpen || isSignInOpen"
      aria-label="Log in">
      <img src="user.png" alt="User" class="user-icon" />
    </button>

    @if (isLoginOpen) {
      <div
        class="login-popup"
        role="dialog"
        aria-modal="true"
        aria-labelledby="login-title"
        (click)="$event.stopPropagation()">
        <h3 id="login-title" class="login-title">Log in</h3>
        <form class="login-form" (submit)="$event.preventDefault()">
          <div class="form-group">
            <label for="login-email">Email</label>
            <input
              id="login-email"
              type="email"
              autocomplete="email" />
          </div>

          <div class="form-group">
            <label for="login-password">Password</label>
            <input
              id="login-password"
              type="password"
              autocomplete="current-password" />
          </div>

          <button type="submit" class="login-submit-btn">Log in</button>

          <a href="#" class="forgot-password" (click)="$event.preventDefault()">Forgot password?</a>
          <a href="#" class="forgot-password" (click)="openSignIn($event)">Sign up</a>
        </form>
      </div>
    }

    @if (isSignInOpen) {
      <div
        class="login-popup"
        role="dialog"
        aria-modal="true"
        aria-labelledby="signin-title"
        (click)="$event.stopPropagation()">
        <h3 id="signin-title" class="login-title">Sign up</h3>
        <form class="login-form" (submit)="$event.preventDefault()">
          <div class="form-group">
            <label for="signin-email">Email</label>
            <input
              id="signin-email"
              type="email"
              autocomplete="email" />
          </div>

          <div class="form-group">
            <label for="signin-username">Username</label>
            <input
              id="signin-username"
              type="text"
              autocomplete="username" />
          </div>

          <div class="form-group">
            <label for="signin-password">Password</label>
            <input
              id="signin-password"
              type="password"
              autocomplete="new-password"
              [value]="registerPassword"
              (input)="onPasswordInput($event)" />
          </div>

          <ul class="password-criteria" aria-label="Password criteria">
            <li class="criterion-item">
              <span class="criterion-dot" [class.valid]="hasMinLength" aria-hidden="true"></span>
              <span class="criterion-text">At least 6 characters</span>
            </li>
            <li class="criterion-item">
              <span class="criterion-dot" [class.valid]="hasUppercase" aria-hidden="true"></span>
              <span class="criterion-text">At least one uppercase letter</span>
            </li>
            <li class="criterion-item">
              <span class="criterion-dot" [class.valid]="hasLowercase" aria-hidden="true"></span>
              <span class="criterion-text">At least one lowercase letter</span>
            </li>
            <li class="criterion-item">
              <span class="criterion-dot" [class.valid]="hasNumber" aria-hidden="true"></span>
              <span class="criterion-text">At least one number</span>
            </li>
          </ul>

          <button type="submit" class="login-submit-btn">Register</button>

          <a href="#" class="forgot-password" (click)="openLogin($event)">Already have an account? Log in</a>
        </form>
      </div>
    }
  </div>
</nav>

<input
  #fileInput
  type="file"
  accept=".gpx"
  class="hidden-file-input"
  (change)="onFileSelected($event)" />
