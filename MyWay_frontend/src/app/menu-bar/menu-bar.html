<nav class="menu-bar">
  <div class="brand">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" />
      <circle cx="12" cy="10" r="3" />
    </svg>
    <span>MyWay</span>
  </div>

  <div class="menu-items">
    <div class="menu-dropdown-container">
      <button
        type="button"
        class="menu-btn"
        [class.active]="isFileMenuOpen"
        (click)="toggleFileMenu($event)"
        aria-haspopup="true"
        [attr.aria-expanded]="isFileMenuOpen">
        File
      </button>

      @if (isFileMenuOpen) {
        <div class="dropdown-menu" role="menu">
          <button
            type="button"
            class="dropdown-item"
            (click)="onAddClick()"
            role="menuitem">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 5v14M5 12h14"/>
            </svg>
            <span>Add</span>
          </button>

          <button
            type="button"
            class="dropdown-item"
            [disabled]="!hasRoute()"
            (click)="onExportClick()"
            role="menuitem">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <polyline points="7 10 12 15 17 10" />
              <line x1="12" y1="15" x2="12" y2="3" />
            </svg>
            <span>Export GPX</span>
          </button>
        </div>
      }
    </div>

    <div class="menu-dropdown-container">
      <button
      type="button"
      class="menu-btn"
      [class.active]="isEditMenuOpen"
      (click)="toggleEditMenu($event)"
      aria-haspopup="true"
      [attr.aria-expanded]="isEditMenuOpen">
      Edit
     </button>
          @if (isEditMenuOpen) {
        <div class="dropdown-menu" role="menu">
          <div class="submenu-container">
            <button
              type="button"
              class="dropdown-item"
              (click)="toggleTrackDesign()"
              aria-haspopup="true"
              [attr.aria-expanded]="isTrackDesignOpen">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
                   stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 17c4 0 4-10 9-10s5 10 9 10" />
              </svg>
              <span>Track design</span>
              <svg class="arrow" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
                   stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="9 18 15 12 9 6" />
              </svg>
            </button>
                  @if (isTrackDesignOpen) {
              <div class="dropdown-menu submenu">
                <label class="dropdown-item">
                  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
                       stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="13.5" cy="6.5" r=".5" fill="currentColor" />
                    <circle cx="17.5" cy="10.5" r=".5" fill="currentColor" />
                    <circle cx="8.5" cy="7.5" r=".5" fill="currentColor" />
                    <circle cx="6.5" cy="12.5" r=".5" fill="currentColor" />
                    <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z" />
                  </svg>
                  <span>Color</span>
                  <input type="color" class="color-input" [value]="color" (input)="onColorChange($event)" />
                </label>
                                <div class="submenu-row">
                  <span>Thickness: {{ weight }} px</span>
                  <input type="range" min="1" max="10" step="1"
                         [value]="weight" (input)="onWeightChange($event)" />
                </div>
              </div>
            }
          </div>
        </div>
      }
    </div>

    <button type="button" class="menu-btn">Help</button>
  </div>
</nav>

<input
  #fileInput
  type="file"
  accept=".gpx"
  class="hidden-file-input"
  (change)="onFileSelected($event)" />
