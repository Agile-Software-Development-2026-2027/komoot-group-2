services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-myway}
      POSTGRES_USER: ${POSTGRES_USER:-myway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-myway}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18+ keeps its data under /var/lib/postgresql/<version>/docker
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build: ./MyWay_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-4200}:80"

volumes:
  db-data:
